[project]
name = "evidence-rerank"
version = "0.1.0"
description = "Evidence-level counterfactual attribution for an opaque neural re-ranker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "peft>=0.13",
    "sentence-transformers>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
train = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "peft>=0.13",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evrank = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["tmp"]

[tool.ruff.lint]
# UP031: percent formatting is the house style across these repos.
ignore = ["UP031"]
